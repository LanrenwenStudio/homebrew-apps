name: Deploy ClipBar to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'sites/clipbar/**'
      - '.github/workflows/deploy-clipbar.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Astro Site
        run: |
          cd sites/clipbar
          npm install
          npm run build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create clipbar --production-branch main || true
          npx wrangler pages deploy sites/clipbar/dist --project-name clipbar --branch main --commit-dirty=true
