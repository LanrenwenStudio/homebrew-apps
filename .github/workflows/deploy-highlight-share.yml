name: Deploy Highlight Share Website to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'sites/highlight-share/**'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: highlight-share-website-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/highlight-share
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sites/highlight-share/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy sites/highlight-share/dist --project-name highlight-share --branch main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
