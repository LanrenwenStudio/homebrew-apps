name: Deploy PauseLoop to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'sites/pauseloop/**'
      - '.github/workflows/deploy-pauseloop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy sites/pauseloop --project-name pauseloop --branch main
